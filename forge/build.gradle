plugins {
    id 'multiloader-loader'
    alias(libs.plugins.legacyforge)
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.api.mixins.json")
    config("${mod_id}.forge.mixins.json")
    config("${mod_id}.ham.mixins.json")
}

artifacts {
    apiElements tasks.named("jarJar")
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}
components.java.withVariantsFromConfiguration(configurations.runtimeElements) {
    skip()
}

legacyForge {
    version = libs.versions.forge.asProvider().get()

    //validateAccessTransformers = true

    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

    parchment.minecraftVersion.set(libs.versions.parchment.minecraft.get())
    parchment.mappingsVersion.set(libs.versions.parchment.mappings.get())

    runs {
        configureEach {
            ideName = "Forge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            if (project.hasProperty("guiShots")) {
                systemProperty "simpleradio.guiShots", "true"
                programArguments.addAll "--quickPlaySingleplayer", "guishots", "--width", "1280", "--height", "720"
            }
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            sourceSet = sourceSets.datagen
        }
        server {
            server()
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file("run/gametest")
            if (project.hasProperty("debugLinks")) systemProperty "simpleradio.debugLinks", "true"
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.development
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    compileOnly(libs.forge.etched)

    compileOnly(libs.forge.computercraft.api)
    compileOnly(libs.forge.curios) { artifact { classifier = "api" } }

    compileOnly(libs.forge.voicechat)
    modRuntimeOnly(libs.forge.lexiconfig)

    compileOnly(libs.forge.create) { artifact { classifier = "slim" } }
    compileOnly(libs.forge.ponder)

    modCompileOnly(libs.forge.valkyrienskies) { transitive = false }

    // Electrodynamics / Voltaic (optional)
    modCompileOnly("maven.modrinth:voltaic:gYoxJKWw") { transitive = false }
    modCompileOnly("maven.modrinth:electrodynamics:QyRCuKfr") { transitive = false }
    if (!project.hasProperty("withoutElectrodynamics")) {
        modRuntimeOnly("maven.modrinth:voltaic:gYoxJKWw") { transitive = false }
        modRuntimeOnly("maven.modrinth:electrodynamics:QyRCuKfr") { transitive = false }
    }

    compileOnly(libs.mixinextras.common)
    annotationProcessor(libs.mixinextras.common)
    implementation(jarJar(libs.forge.mixinextras.get()))

    modRuntimeOnly libs.bundles.forge.environment
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json,${mod_id}.api.mixins.json,${mod_id}.ham.mixins.json"
    ])
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}